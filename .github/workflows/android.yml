name: Android

# Runs on pushes to main and on every PR. Tags build a signed release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  # A new push supersedes the previous run on the same ref; there is no value in
  # finishing a build for a commit nobody will look at again.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Lint gates the build (warningsAsErrors, no baseline), so this is the step
      # that fails on a regression rather than a reviewer noticing it.
      - run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      # The release build is where R8 problems show up, and they show up as a
      # crash on a user's device if nobody builds it until release day.
      - run: ./gradlew --no-daemon assembleRelease

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/test-results/**

  instrumented:
    name: Instrumented tests
    runs-on: ubuntu-latest
    # The Room migration tests are the ones that stop a schema change eating
    # somebody's profiles, so they are not optional.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # KVM is what makes the emulator usable on a hosted runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # No animations and no snapshot: a cold, quiet emulator is the one that
          # produces reproducible instrumentation results.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/**

  release:
    name: Signed release bundle
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, instrumented]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode comes from the commit count, which needs real history.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The keystore never lives in the repository. It arrives as a base64 secret,
      # is written outside the working tree, and is deleted in a step that always
      # runs so a failed build cannot leave it on disk.
      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "UPLOAD_KEYSTORE_BASE64 is not set; cannot build a signed release." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build AAB
        env:
          PORTAL_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          PORTAL_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          PORTAL_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          PORTAL_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: app/build/outputs/bundle/release/*.aab
